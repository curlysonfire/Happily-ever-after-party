<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  color:white;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:'Pacifico', cursive;
  animation:fadeIn 2s ease;
  padding:20px;
  overflow:hidden;
}

/* video */

video{
  width:98%;
  max-width:1400px;
  max-height:78vh;
  height:auto;
  border-radius:12px;
  box-shadow:0 0 40px rgba(0,0,0,.8);
  object-fit:contain;
}

/* RSVP button */

.rsvp-btn{
  margin-top:24px;
  padding:14px 32px;
  font-size:1.6rem;
  color:white;
  text-decoration:none;
  font-family:Germanic, sans-serif;
  font-weight:bold;
  border:2px solid white;
  border-radius:40px;
  letter-spacing:2px;

  /* hidden initially */
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;

  transition:
    opacity 1.2s ease,
    transform 1.2s ease,
    background .3s ease,
    color .3s ease;
}

/* visible state */

.rsvp-btn.show{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.rsvp-btn:hover{
  background:white;
  color:black;
  transform:scale(1.05);
}

/* tap text */

.tap{
  margin-top:10px;
  font-family:Germanic, sans-serif;
  font-size:14px;
  opacity:.7;

  transition:opacity 1s ease;
}

.tap.hide{
  opacity:0;
}

/* fade in */

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* mobile optimization */

@media (max-width:768px){

  body{
    padding:12px;
    justify-content:center;
  }

  video{
    width:100%;
    max-height:74vh;
    border-radius:10px;
  }

  .rsvp-btn{
    font-size:1.2rem;
    padding:12px 24px;
    margin-top:20px;
  }

  .tap{
    font-size:12px;
  }

}

</style>
</head>

<body>

<video id="bgvideo" autoplay muted playsinline>
  <source src="My movie 5_1.mp4" type="video/mp4">
</video>

<a href="https://www.theknot.com/us/moraleshappilyeverafter"
   target="_blank"
   class="rsvp-btn"
   id="rsvpBtn">
  RSVP NOW
</a>

<div class="tap" id="tapText">
  Tap video for sound
</div>

<script>

const video = document.getElementById("bgvideo");
const rsvpBtn = document.getElementById("rsvpBtn");
const tapText = document.getElementById("tapText");

/* tap for sound */

video.addEventListener("click", () => {
  video.muted = false;
  video.play();
});

/* show button when video ends */

video.addEventListener("ended", () => {
  rsvpBtn.classList.add("show");
  tapText.classList.add("hide");
});

</script>

</body>
</html>
