<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP</title>

<style>

/* RESET */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* BODY */

body{
  background:black;
  min-height:100vh;
  overflow:hidden;
  color:white;
  font-family:Arial, sans-serif;
  position:relative;
}

/* INTRO SCREEN */

#introScreen{
  position:fixed;
  inset:0;
  z-index:999;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  transition:opacity 1.5s ease;
}

/* BRIGHTER BACKGROUND IMAGE */

#introScreen::before{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      rgba(0,0,0,.12),
      rgba(0,0,0,.28)
    ),
    url("file_00000000071471fd88a37a14ea943433.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  filter:
    brightness(1.18)
    contrast(1.05)
    saturate(1.08);

  transform:scale(1.05);

  animation:slowZoom 18s ease forwards;

}

/* LIGHTER VIGNETTE */

#introScreen::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    radial-gradient(
      circle at center,
      transparent 35%,
      rgba(0,0,0,.22) 100%
    );

}

#introScreen.hide{
  opacity:0;
  pointer-events:none;
}

/* ZOOM EFFECT */

@keyframes slowZoom{

  from{
    transform:scale(1.05);
  }

  to{
    transform:scale(1.15);
  }

}

/* INTRO CONTENT */

.intro-content{
  position:relative;
  z-index:2;
  text-align:center;
}

/* ENTER BUTTON */

#enterBtn{

  padding:16px 42px;

  font-size:1rem;

  background:rgba(0,0,0,.25);

  backdrop-filter:blur(8px);

  color:white;

  border:2px solid rgba(255,255,255,.8);

  border-radius:50px;

  cursor:pointer;

  letter-spacing:5px;

  transition:.35s ease;

  animation:buttonFloat 3s ease-in-out infinite;

  box-shadow:
    0 0 20px rgba(255,255,255,.15);

}

#enterBtn:hover{

  background:white;

  color:black;

  transform:scale(1.06);

}

@keyframes buttonFloat{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-6px);
  }

  100%{
    transform:translateY(0px);
  }

}

/* EMBERS */

.embers{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}

.ember{
  position:absolute;
  bottom:-20px;
  border-radius:50%;
  background:rgba(255,140,0,.85);

  box-shadow:
    0 0 8px rgba(255,120,0,.9),
    0 0 20px rgba(255,60,0,.7);

  animation:floatUp linear infinite;
}

@keyframes floatUp{

  0%{
    transform:
      translateY(0)
      translateX(0)
      scale(1);

    opacity:0;
  }

  10%{
    opacity:1;
  }

  100%{
    transform:
      translateY(-120vh)
      translateX(80px)
      scale(0);

    opacity:0;
  }

}

/* FOG */

.fog{
  position:fixed;
  bottom:0;
  left:0;

  width:200%;
  height:220px;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.08),
      transparent 70%
    );

  filter:blur(45px);

  animation:fogMove 18s linear infinite;

  pointer-events:none;

  z-index:1;
}

@keyframes fogMove{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-30%);
  }

}

/* MAIN CONTENT */

#mainContent{
  position:relative;
  z-index:2;

  min-height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:12px;

  opacity:0;

  transition:opacity 2s ease;
}

#mainContent.show{
  opacity:1;
}

/* VIDEO */

video{
  width:100%;
  max-width:1400px;
  max-height:78vh;

  object-fit:contain;

  border-radius:14px;

  background:black;

  box-shadow:
    0 0 30px rgba(255,255,255,.08),
    0 0 80px rgba(0,0,0,.9);
}

/* RSVP BUTTON */

.rsvp-btn{

  margin-top:22px;

  padding:14px 34px;

  font-size:1.4rem;

  font-weight:bold;

  letter-spacing:3px;

  color:white;

  text-decoration:none;

  border:3px solid white;

  border-radius:50px;

  opacity:0;

  transform:translateY(20px);

  pointer-events:none;

  transition:
    opacity 1.2s ease,
    transform 1.2s ease,
    background .3s ease,
    color .3s ease;

}

.rsvp-btn.show{

  opacity:1;

  transform:translateY(0);

  pointer-events:auto;

  animation:pulse 2.5s infinite;

}

@keyframes pulse{

  0%{
    box-shadow:0 0 0 rgba(255,255,255,0);
  }

  50%{
    box-shadow:
      0 0 18px rgba(255,255,255,.45),
      0 0 40px rgba(255,255,255,.18);
  }

  100%{
    box-shadow:0 0 0 rgba(255,255,255,0);
  }

}

.rsvp-btn:hover{

  background:white;

  color:black;

  transform:scale(1.06);

}

/* TAP TEXT */

.tap{

  margin-top:12px;

  font-size:14px;

  opacity:.75;

  transition:opacity 1s ease;

}

.tap.hide{
  opacity:0;
}

/* MOBILE */

@media (max-width:768px){

  video{
    max-height:72vh;
  }

  .rsvp-btn{
    font-size:1.1rem;
    padding:12px 26px;
  }

  .tap{
    font-size:13px;
  }

  #enterBtn{
    font-size:.9rem;
    padding:14px 34px;
  }

}

</style>
</head>

<body>

<!-- INTRO SCREEN -->

<div id="introScreen">

  <div class="intro-content">

    <button id="enterBtn">
      CLICK TO ENTER
    </button>

  </div>

</div>

<!-- EMBERS -->

<div class="embers" id="embers"></div>

<!-- FOG -->

<div class="fog"></div>

<!-- MAIN CONTENT -->

<div id="mainContent">

  <video id="bgvideo" playsinline preload="auto">

    <source src="My movie 5.mp4" type="video/mp4">

  </video>

  <a
    href="https://www.theknot.com/us/moraleshappilyeverafter"
    target="_blank"
    class="rsvp-btn"
    id="rsvpBtn"
  >
    RSVP NOW
  </a>

  <div class="tap" id="tapText">
    Tap video for sound
  </div>

</div>

<script>

/* ELEMENTS */

const video =
  document.getElementById("bgvideo");

const rsvpBtn =
  document.getElementById("rsvpBtn");

const tapText =
  document.getElementById("tapText");

const enterBtn =
  document.getElementById("enterBtn");

const introScreen =
  document.getElementById("introScreen");

const mainContent =
  document.getElementById("mainContent");

/* ENTER EXPERIENCE */

enterBtn.addEventListener("click", async () => {

  const elem = document.documentElement;

  if(elem.requestFullscreen){

    elem.requestFullscreen();

  }else if(elem.webkitRequestFullscreen){

    elem.webkitRequestFullscreen();

  }

  video.muted = false;

  video.volume = 1;

  try{

    await video.play();

  }catch(err){

    console.log("Video play blocked:", err);

  }

  introScreen.classList.add("hide");

  setTimeout(() => {

    mainContent.classList.add("show");

  }, 800);

});

/* TAP VIDEO FOR SOUND */

video.addEventListener("click", () => {

  video.muted = false;

  video.volume = 1;

  video.play();

  tapText.classList.add("hide");

});

/* SHOW RSVP */

video.addEventListener("ended", () => {

  rsvpBtn.classList.add("show");

  tapText.classList.add("hide");

});

/* FALLBACK */

video.addEventListener("error", () => {

  console.log("Video failed to load");

  rsvpBtn.classList.add("show");

});

/* EMBERS */

const embersContainer =
  document.getElementById("embers");

for(let i = 0; i < 45; i++){

  const ember =
    document.createElement("div");

  ember.classList.add("ember");

  ember.style.left =
    Math.random() * 100 + "vw";

  const size =
    Math.random() * 5 + 3;

  ember.style.width =
    size + "px";

  ember.style.height =
    size + "px";

  ember.style.animationDuration =
    (Math.random() * 10 + 7) + "s";

  ember.style.animationDelay =
    Math.random() * 10 + "s";

  ember.style.opacity =
    Math.random();

  embersContainer.appendChild(ember);

}

</script>

</body>
</html>
